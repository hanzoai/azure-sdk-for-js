# Azure SDK for JS — a 292-package monorepo. npm packages, no image.
#
# The gate builds sdk/core: abort-controller, core-auth, core-client,
# core-rest-pipeline, core-lro, core-paging, core-tracing, core-util, core-xml,
# ts-http-runtime and the rest of that directory. It is scoped, deliberately,
# and this is what the scope means: every one of the other 275 service packages
# imports these, so a break here breaks all of them — but a break inside a
# single service package is NOT caught by this run.
#
# The unscoped alternative is `pnpm install && turbo run build` over all 292,
# which is hours of a shared ten-runner fleet per push. `...` on the filter
# includes each core package's own workspace dependencies, so nothing it needs
# is missing from the install.
test:
  - name: build-core
    run: pnpm install --frozen-lockfile --filter './sdk/core/*...' && pnpm --filter './sdk/core/*' build
